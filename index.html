
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBTI로 포켓몬 찾기</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 25px 15px;
  font-family: "Malgun Gothic", sans-serif;
  background: #fff8e7;
  color: #493c2b;
  text-align: center;
}

.container {
  max-width: 850px;
  margin: auto;
}

header { padding: 20px 10px; }

.header-icon { font-size: 55px; }

h1 {
  color: #75552b;
  font-size: clamp(28px, 5vw, 42px);
  margin: 10px 0;
}

.subtitle {
  font-size: 18px;
  line-height: 1.8;
  color: #786b57;
}

.section-title {
  font-size: 23px;
  margin: 25px 0 18px;
}

.mbti-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin: 25px 0;
}

.mbti-button {
  padding: 17px 5px;
  border: 2px solid #f1d99c;
  border-radius: 15px;
  background: #fffdf6;
  color: #72542d;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

.mbti-button:hover {
  background: #ffe8a3;
  transform: translateY(-3px);
}

button:focus-visible {
  outline: 3px solid #9b732b;
  outline-offset: 3px;
}

.result {
  display: none;
  margin-top: 25px;
}

.result-card {
  padding: 28px 20px;
  border: 3px solid #f3d88e;
  border-radius: 25px;
  background: #fffdf6;
  box-shadow: 0 8px 20px #b99a4a20;
}

.result-label {
  display: inline-block;
  padding: 9px 18px;
  border-radius: 30px;
  background: #ffedb5;
  color: #785621;
  font-weight: bold;
}

.pokemon-image {
  display: block;
  width: 250px;
  height: 250px;
  max-width: 80%;
  object-fit: contain;
  margin: 15px auto 5px;
}

.pokemon-name {
  font-size: 34px;
  color: #79552b;
  margin: 5px 0 12px;
}

.pokemon-description {
  max-width: 560px;
  margin: auto;
  font-size: 18px;
  line-height: 1.9;
  word-break: keep-all;
}

.reason-box {
  margin-top: 25px;
  padding: 20px;
  border-radius: 18px;
  background: #fff4d4;
  text-align: left;
}

.reason-box h3,
.compatibility h3 {
  margin: 0 0 12px;
  font-size: 20px;
}

.reason-box p,
.compatibility p {
  margin: 0;
  font-size: 17px;
  line-height: 1.9;
  word-break: keep-all;
}

.compatibility {
  margin-top: 18px;
  padding: 22px 15px;
  border-radius: 18px;
  background: #fff0e2;
}

.compatibility h3 { color: #965d39; }

.partner-type {
  display: inline-block;
  margin: 5px 0 12px;
  padding: 10px 22px;
  border-radius: 14px;
  background: white;
  border: 2px solid #f0c9a8;
  color: #875333;
  font-size: 24px;
  font-weight: bold;
}

.again-button {
  width: 100%;
  margin-top: 22px;
  padding: 17px;
  border: none;
  border-radius: 15px;
  background: #e9b94f;
  color: #493719;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
}

.again-button:hover { background: #dfaa32; }

.footer {
  margin-top: 30px;
  color: #9a896f;
  font-size: 14px;
  line-height: 1.8;
}

@media (max-width: 480px) {
  .mbti-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 9px;
  }

  .mbti-button { padding: 15px 5px; }
  .result-card { padding: 22px 14px; }
  .pokemon-image { width: 210px; height: 210px; }
  .pokemon-name { font-size: 29px; }

  .pokemon-description,
  .reason-box p,
  .compatibility p {
    font-size: 16px;
  }
}
</style>
</head>

<body>
<main class="container">

<header>
  <div class="header-icon">🌼</div>
  <h1>MBTI로 포켓몬 찾기</h1>
  <p class="subtitle">
    내 성격과 꼭 닮은 포켓몬은 누구일까요?<br>
    MBTI를 선택하고 나만의 포켓몬을 찾아보세요!
  </p>
</header>

<section id="selection">
  <h2 class="section-title">✨ 나의 MBTI를 선택하세요</h2>
  <div class="mbti-grid" id="mbtiGrid"></div>
</section>

<section class="result" id="result" aria-live="polite">
  <div class="result-card">
    <span class="result-label" id="resultType"></span>

    <img
      class="pokemon-image"
      id="pokemonImage"
      src=""
      alt="선택한 포켓몬 공식 일러스트"
      width="250"
      height="250"
    >

    <h2 class="pokemon-name" id="pokemonName"></h2>
    <p class="pokemon-description" id="pokemonDescription"></p>

    <div class="reason-box">
      <h3>💛 나와 닮은 이유</h3>
      <p id="reason"></p>
    </div>

    <div class="compatibility">
      <h3>🤝 나와 잘 맞는 유형</h3>
      <div class="partner-type" id="partnerType"></div>
      <p id="partnerDescription"></p>
    </div>
  </div>

  <button class="again-button" id="againButton" type="button">
    🔄 다시 고르기
  </button>
</section>

<footer class="footer">
  포켓몬 이미지 출처: PokeAPI Sprites 저장소의 공식 일러스트 컬렉션<br>
  MBTI별 포켓몬과 궁합은 재미를 위한 창작 설정입니다.
</footer>

</main>

<script>
const IMAGE_BASE =

const pokemonData = {

    partner: "ESFP",
    partnerReason: "신중한 ISTJ와 활발한 ESFP는 서로에게 새로운 시각과 즐거움을 줄 수 있어요."

    partner: "ESFP",

  },

    partner: "ENFP",
    partnerReason: "깊이 생각하는 INFJ와 호기심 많은 ENFP는 서로의 생각과 가능성을 넓혀 줄 수 있어요."

    partner: "ESFJ",
    partnerReason: "실용적인 ISTP와 사람을 잘 챙기는 ESFJ는 서로 부족한 부분을 보완할 수 있어요."
  },

    partner: "ENFJ",

    partnerReason: "아이디어를 탐구하는 INTP와 실행을 이끄는 ENTJ는 생각을 구체적인 계획으로 발전시킬 수 있어요."
  },
  ESTP: {
    pokemon: "리자몽", id: 6,
    description: "도전을 즐기고 행동력이 넘치는 포켓몬!",
    reason: "새로운 상황에서도 빠르게 판단하고 직접 부딪쳐 보는 모습이 닮았어요. 활동적이고 모험을 즐기는 성격이에요.",
    partner: "ISFJ",
    partnerReason: "즉흥적인 ESTP와 세심한 ISFJ는 서로 다른 강점을 배우며 균형을 맞출 수 있어요."
  },
  ESFP: {
    pokemon: "피카츄", id: 25,
    description: "밝은 에너지로 주변을 즐겁게 하는 포켓몬!",
    reason: "사람들과 어울리며 즐거운 순간을 만드는 모습이 닮았어요. 감정을 솔직하게 표현하고 지금 이 순간을 소중히 여겨요.",
    partner: "ISTJ",
    partnerReason: "활발한 ESFP와 차분한 ISTJ는 서로에게 즐거움과 안정감을 줄 수 있어요."
  },
  ENFP: {
    pokemon: "푸린", id: 39,
    description: "창의적이고 사람들에게 즐거움을 주는 포켓몬!",
    reason: "새로운 아이디어가 넘치고 사람들과 소통하는 것을 좋아하는 모습이 닮았어요. 호기심과 상상력으로 일상에 활기를 더해요.",
    partner: "INFJ",
    partnerReason: "아이디어가 풍부한 ENFP와 깊이 생각하는 INFJ는 서로의 가능성을 발견할 수 있어요."
  },
  ENTP: {
    pokemon: "팬텀", id: 94,
    description: "장난기와 재치, 기발한 생각이 돋보이는 포켓몬!",
    reason: "남들과 다른 방식으로 생각하고 새로운 방법을 시도하는 모습이 닮았어요. 토론과 실험을 통해 재미있는 답을 찾아요.",
    partner: "INFJ",
    partnerReason: "재치 있는 ENTP와 통찰력 있는 INFJ는 서로의 생각을 깊게 발전시키고 새로운 관점을 얻을 수 있어요."
  },
  ESTJ: {
    pokemon: "괴력몬", id: 68,
    description: "목표를 향해 힘차게 나아가는 든든한 포켓몬!",
    reason: "일을 체계적으로 정리하고 책임 있게 이끄는 모습이 닮았어요. 분명한 목표를 세우고 실천하는 데 강점이 있어요.",

    reason: "사람들과 함께하는 것을 좋아하고 모두가 편안하도록 노력하는 모습이 닮았어요. 협력과 따뜻한 배려를 중요하게 생각해요.",

  ENFJ: {

    partner: "INFP",
    partnerReason: "응원을 잘하는 ENFJ와 가치관을 중요하게 여기는 INFP는 서로의 꿈과 감정을 존중할 수 있어요."
  },
  ENTJ: {
    pokemon: "보스로라", id: 306,
    description: "강한 추진력과 목표 의식을 가진 포켓몬!",
    reason: "큰 목표를 세우고 효율적인 방법으로 문제를 해결하는 모습이 닮았어요. 어려운 상황에서도 결단력 있게 앞으로 나아가요.",
    partner: "INTP",
    partnerReason: "실행력이 강한 ENTJ와 분석을 즐기는 INTP는 아이디어를 구체적인 결과로 발전시킬 수 있어요."

const types = [
  "ISTJ", "ISFJ", "INFJ", "INTJ",
  "ISTP", "ISFP", "INFP", "INTP",
  "ESTP", "ESFP", "ENFP", "ENTP",
  "ESTJ", "ESFJ", "ENFJ", "ENTJ"
];

const grid = document.getElementById("mbtiGrid");
const selection = document.getElementById("selection");
const result = document.getElementById("result");
const pokemonImage = document.getElementById("pokemonImage");

types.forEach(function(type) {
  const button = document.createElement("button");
  button.className = "mbti-button";
  button.type = "button";
  button.textContent = type;

  button.addEventListener("click", function() {
    showResult(type);
  });

  grid.appendChild(button);
});

function showResult(type) {
  const data = pokemonData[type];

  document.getElementById("resultType").textContent =
    "나의 MBTI : " + type;

  document.getElementById("pokemonName").textContent =
    data.pokemon;

  document.getElementById("pokemonDescription").textContent =
    data.description;

  document.getElementById("reason").textContent =
    data.reason;

  document.getElementById("partnerType").textContent =
    data.partner;

  document.getElementById("partnerDescription").textContent =
    data.partnerReason;

  // 포켓몬 이미지 파일 주소 설정
  pokemonImage.alt = data.pokemon + " 공식 일러스트";
  pokemonImage.src = IMAGE_BASE + data.id + ".png";

  // 이미지 로드 실패 시 안내
  pokemonImage.onerror = function() {
    pokemonImage.onerror = null;
    pokemonImage.removeAttribute("src");
    pokemonImage.alt = "이미지를 불러올 수 없습니다.";
    pokemonImage.style.display = "none";

    const description =
      document.getElementById("pokemonDescription");

    description.textContent =
      data.description +
      " (이미지를 표시할 수 없습니다. 인터넷 연결을 확인해 주세요.)";
  };

  pokemonImage.onload = function() {
    pokemonImage.style.display = "block";
    document.getElementById("pokemonDescription").textContent =
      data.description;
  };

  selection.style.display = "none";
  result.style.display = "block";

  window.scrollTo({ top: 0, behavior: "smooth" });
}

document.getElementById("againButton").addEventListener(
  "click",
  function() {
    result.style.display = "none";
    selection.style.display = "block";

    window.scrollTo({ top: 0, behavior: "smooth" });
  }
);
</script>
</body>
</html>
