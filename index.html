<!DOCTYPE html>
<html lang="ko">
<head><meta charset="utf-8"><title>MBTI로 포켓몬 찾기</title>
<style>
  body{font-family:sans-serif;background:#fffdf7;color:#3a2e1a;
       max-width:600px;margin:40px auto;padding:0 20px;line-height:1.7}
  h1{color:#e8930c}
  .types{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  button{font:inherit;cursor:pointer;border:2px solid #f0e2bc;background:#fff;
         border-radius:10px;padding:10px 0;font-weight:800}
  button:hover{border-color:#e8930c}
  #result{display:none;background:#fff6e0;border-radius:18px;padding:24px;margin-top:20px;text-align:center}
  #result .poke-img{width:160px;height:160px;object-fit:contain;margin-bottom:10px}
  #result .name{font-size:1.6rem;font-weight:900;color:#e8930c}
</style></head>
<body>
  <h1>🐣 MBTI로 내 포켓몬 찾기</h1>
  <p>내 MBTI를 골라 보세요.</p>
  <div class="types" id="types"></div>
  <div id="result"></div>
<script>
// PokéAPI의 공식 포켓몬 일러스트 이미지를 사용합니다.
const P={
  ENFP:["피카츄","https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png","호기심 많고 활발한 분위기 메이커","INFJ"],
  ENFJ:["푸린","https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/39.png","사람을 이끄는 따뜻한 리더","INFP"],
  ENTP:["파오리","https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/83.png","재치 있는 아이디어 뱅크","INFJ"],
  ENTJ:["갸라도스","https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/130.png","강한 추진력의 리더","INTP"],
  ESFP:["이상해꽃","https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/3.png","밝고 사교적인 무드메이커","ISFJ"],
  ESFJ:["럭키","https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/113.png","곁을 챙기는 다정한 타입","ISFP"],
  ESTP:["리자몽","https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/6.png","에너지 넘치는 모험가","ISTJ"],
  ESTJ:["코뿌리","https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/112.png","책임감 강한 실행가","ISFP"],
  INFP:["이브이","https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/133.png","여린 감성의 몽상가","ENFJ"],
  INFJ:["가디안","https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/282.png","깊이 공감하는 조언자","ENFP"],
  INTP:["폴리곤","https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/137.png","논리적인 탐구자","ENTJ"],
  INTJ:["뮤츠","https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/150.png","전략적인 목표 지향형","ENFP"],
  ISFP:["치코리타","https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/152.png","조용한 예술가 감성","ESFJ"],
  ISFJ:["밀탱크","https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/241.png","든든히 지키는 수호자","ESTP"],
  ISTP:["팬텀","https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/94.png","손재주 좋은 문제해결사","ESFJ"],
  ISTJ:["거북왕","https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/9.png","믿음직한 원칙주의자","ESFP"]
};
document.getElementById("types").innerHTML=
  Object.keys(P).map(t=>`<button onclick="show('${t}')">${t}</button>`).join("");
function show(t){
  const [name,imgUrl,why,match]=P[t];
  const r=document.getElementById("result"); r.style.display="block";
  r.innerHTML=`<img src="${imgUrl}" alt="${name}" class="poke-img"><div class="name">${name}</div>`+
    `<p>${t} → <b>${why}</b></p><p>잘 맞는 유형: <b>${match}</b></p>`+
    `<button onclick="location.reload()">다시 고르기</button>`;
}
</script>
</body></html>
