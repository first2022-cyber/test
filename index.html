<!DOCTYPE html>
<html lang="ko">
<head><meta charset="utf-8"><title>MBTI로 포켓몬 찾기</title>
<style>
  body{font-family:sans-serif;background:#fffdf7;color:#3a2e1a;
       max-width:600px;margin:40px auto;padding:0 20px;line-height:1.7}
  h1{color:#e8930c}
  .types{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  button{font:inherit;cursor:pointer;border:2px solid #f0e2bc;background:#fff;
         border-radius:10px;padding:10px 0;font-weight:800}
  button:hover{border-color:#e8930c}
  #result{display:none;background:#fff6e0;border-radius:18px;padding:24px;margin-top:20px;text-align:center}
  #result .emoji{font-size:3rem}
  #result .name{font-size:1.6rem;font-weight:900;color:#e8930c}
</style></head>
<body>
  <h1>🐣 MBTI로 내 포켓몬 찾기</h1>
  <p>내 MBTI를 골라 보세요.</p>
  <div class="types" id="types"></div>
  <div id="result"></div>
<script>
// [유형] : [포켓몬, 이모지, 어울리는 이유, 궁합 유형]
const P={
  ENFP:["피카츄","⚡","호기심 많고 활발한 분위기 메이커","INFJ"],
  ENFJ:["푸린","🎤","사람을 이끄는 따뜻한 리더","INFP"],
  ENTP:["파오리","🦆","재치 있는 아이디어 뱅크","INFJ"],
  ENTJ:["갸라도스","🌊","강한 추진력의 리더","INTP"],
  ESFP:["이상해꽃","🌻","밝고 사교적인 무드메이커","ISFJ"],
  ESFJ:["럭키","💗","곁을 챙기는 다정한 타입","ISFP"],
  ESTP:["리자몽","🔥","에너지 넘치는 모험가","ISTJ"],
  ESTJ:["코뿌리","🐗","책임감 강한 실행가","ISFP"],
  INFP:["이브이","🌸","여린 감성의 몽상가","ENFJ"],
  INFJ:["가디안","🌙","깊이 공감하는 조언자","ENFP"],
  INTP:["폴리곤","🧩","논리적인 탐구자","ENTJ"],
  INTJ:["뮤츠","🔮","전략적인 목표 지향형","ENFP"],
  ISFP:["치코리타","🌿","조용한 예술가 감성","ESFJ"],
  ISFJ:["밀탱크","🐄","든든히 지키는 수호자","ESTP"],
  ISTP:["팬텀","👻","손재주 좋은 문제해결사","ESFJ"],
  ISTJ:["거북왕","🐢","믿음직한 원칙주의자","ESFP"]
};
document.getElementById("types").innerHTML=
  Object.keys(P).map(t=>`<button onclick="show('${t}')">${t}</button>`).join("");
function show(t){
  const [name,emoji,why,match]=P[t];
  const r=document.getElementById("result"); r.style.display="block";
  r.innerHTML=`<div class="emoji">${emoji}</div><div class="name">${name}</div>`+
    `<p>${t} → <b>${why}</b></p><p>잘 맞는 유형: <b>${match}</b></p>`+
    `<button onclick="location.reload()">다시 고르기</button>`;
}
</script>
</body></html>
